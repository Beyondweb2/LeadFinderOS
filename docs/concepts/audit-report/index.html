<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Concepts</title>
<!--
  CONCEPT ONLY — NOT THE LIVE REPORT.
  Three visual directions for the Quick AI Visibility Check, rendered from ONE fixture so the
  data is identical and only the presentation differs. Nothing here is imported by the app, the
  edge functions or the build. The live report is src/lib/aiAuditReportHtml.ts and is untouched.
  The answer text below is ILLUSTRATIVE FIXTURE DATA, not a recorded measurement.
  URL params: ?c=1|2|3 picks the concept, ?named=1 features the named answer, ?bar=0 hides the
  gallery bar (used for print).
-->
<style>
  :root{
    --band:#101114; --band-2:#2C2D34; --foot:#0A0B0D;
    --gold:#FFD13F; --yellow:#F5B301; --on-gold:#3a2d05; --gold-tint:#fffaeb; --gold-line:#e6c968;
    --ink:#131417; --ink-2:#334155; --muted:#5d6067; --faint:#9C9FA7; --line:#e8e9ec;
    --page:#f4f5f7; --paper:#ffffff; --panel:#f0f1f3; --panel-2:#e9eaed;
    --red:#c8202b; --red-tint:#fdf0f0; --red-line:#f3c9cc;
    --amber:#b4740a; --amber-tint:#fff7e8; --amber-line:#f0d9a8;
    --green:#15803d; --green-tint:#ecf7f0; --green-line:#c5e6d1;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
  svg{display:block}

  /* ── Gallery chrome (not part of any concept) ─────────────────────────────── */
  .gal{position:sticky;top:0;z-index:20;background:#2a1d00;color:#fff;border-bottom:3px solid var(--gold)}
  .gal-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
  .gal-flag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#1a1300;padding:4px 9px;border-radius:4px}
  .gal-note{font-size:12px;color:#e9dcb8;flex:1 1 260px}
  .gal-tabs,.gal-toggle{display:flex;gap:6px;flex-wrap:wrap}
  .gal button{font:inherit;font-size:13px;font-weight:600;border:1px solid #6b5a2a;background:transparent;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer}
  .gal button[aria-pressed="true"]{background:#fff;color:#1a1300;border-color:#fff}
  .concept{display:none}
  .concept.on{display:block}

  /* Shared bits */
  .wm{font-weight:800;letter-spacing:-.03em;line-height:1}
  .wm i{font-style:normal;color:var(--yellow);font-size:1.35em;line-height:0}
  .mk{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
  .mk svg{width:62%;height:62%}
  .mk-gpt{background:#0d0d0d}
  .mk-gpt svg{fill:#fff}
  .mk-gai{background:#fff;box-shadow:inset 0 0 0 1px #dadce0}
  .mk-gai svg{width:70%;height:70%}
  .tick,.cross{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;font-weight:800}
  .fixture-note{font-size:11.5px;color:var(--faint);margin-top:6px}
  .t-red{color:var(--red)} .t-amber{color:var(--amber)} .t-green{color:var(--green)}

  /* ══════════════════════════════════════════════════════════════════════════
     CONCEPT 1 — PREMIUM EDITORIAL
     ══════════════════════════════════════════════════════════════════════════ */
  .c1{padding:40px 16px 64px}
  .c1-sheet{max-width:860px;margin:0 auto;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,17,20,.04),0 18px 48px -24px rgba(16,17,20,.18)}
  .c1-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:32px 56px 22px;border-bottom:1px solid var(--ink)}
  .c1-head .wm{font-size:26px}
  .c1-meta{text-align:right;font-size:12px;color:var(--muted);line-height:1.6}
  .c1-meta b{display:block;color:var(--ink);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .c1-body{padding:0 56px 48px}
  .c1-sec{padding:40px 0 0;break-inside:avoid}
  .c1-kicker{display:flex;gap:12px;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
  .c1-kicker span{color:var(--ink);font-variant-numeric:tabular-nums}
  .c1-kicker::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(-3px)}
  .c1-for{font-size:15px;color:var(--muted);margin:30px 0 0}
  .c1-for b{color:var(--ink)}
  .c1-hero{display:grid;grid-template-columns:auto 1fr;gap:12px 40px;align-items:center}
  .c1-big{font-family:var(--serif);font-size:128px;line-height:.85;letter-spacing:-.04em;font-weight:400}
  .c1-big small{font-size:.36em;letter-spacing:0;vertical-align:1.25em;margin-left:10px}
  .c1-verdict h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.18;letter-spacing:-.01em;margin:0 0 10px}
  .c1-verdict p{margin:0;color:var(--ink-2);font-size:15px}
  .c1-count{font-size:13px;font-weight:600;color:var(--muted);margin-top:16px;letter-spacing:.01em}
  .c1-engines{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
  .c1-eng{display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border:1px solid var(--line);border-radius:999px;font-size:14px}
  .c1-eng .mk{width:28px;height:28px}
  .c1-eng b{font-variant-numeric:tabular-nums;font-size:15px}
  .c1-eng .dots{display:flex;gap:4px;margin-left:4px}
  .c1-eng .dots i{width:8px;height:8px;border-radius:50%;background:var(--panel-2)}
  .c1-eng .dots i.y{background:var(--green)}
  .c1-eng .dots i.n{background:var(--red);opacity:.85}
  .c1-q{background:var(--band);color:#fff;padding:30px 36px 32px;position:relative;overflow:hidden}
  .c1-q-label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .c1-q-text{font-family:var(--serif);font-size:34px;line-height:1.2;margin:10px 0 0;letter-spacing:-.01em}
  .c1-q-text::before{content:"\201C";color:var(--gold)} .c1-q-text::after{content:"\201D";color:var(--gold)}
  .c1-q-sub{font-size:12.5px;color:#c9cbd1;margin-top:14px}
  .c1-ans{border:1px solid var(--line);border-top:0}
  .c1-ans-head{display:flex;align-items:center;gap:12px;padding:16px 36px;border-bottom:1px solid var(--line);background:#fafafb}
  .c1-ans-head .mk{width:30px;height:30px}
  .c1-ans-head b{font-size:14px;letter-spacing:.02em}
  .c1-ans-head .c1-ans-sub{margin-left:auto;font-size:12px;color:var(--muted)}
  .c1-ans-text{padding:28px 36px 8px;font-family:var(--serif);font-size:20px;line-height:1.7;color:#1d1f24;margin:0}
  .c1-ans-text mark{background:linear-gradient(transparent 58%,rgba(245,179,1,.42) 58%);color:inherit;padding:0 1px;font-weight:600}
  .c1-ans-text mark sup{font-family:var(--sans);font-size:10px;font-weight:800;color:#8a6d1a;margin-left:2px}
  .c1-ans-text mark.me{background:linear-gradient(transparent 58%,rgba(21,128,61,.28) 58%)}
  .c1-named{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 36px 26px;font-size:13px;color:var(--ink-2);margin:0;list-style:none}
  .c1-named li{display:flex;gap:6px;align-items:baseline}
  .c1-named li b{font-size:10px;color:#8a6d1a}
  .c1-verdict-strip{display:flex;align-items:center;gap:14px;padding:18px 36px;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .c1-verdict-strip .tick,.c1-verdict-strip .cross{width:28px;height:28px;font-size:15px;color:#fff}
  .c1-verdict-strip.no{background:var(--red-tint);color:var(--red);border-top:1px solid var(--red-line)}
  .c1-verdict-strip.no .cross{background:var(--red)}
  .c1-verdict-strip.yes{background:var(--green-tint);color:var(--green);border-top:1px solid var(--green-line)}
  .c1-verdict-strip.yes .tick{background:var(--green)}
  .c1-means{display:grid;grid-template-columns:4px 1fr;gap:0 22px;margin-top:28px}
  .c1-means::before{content:"";background:var(--gold);border-radius:2px}
  .c1-means h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .c1-means p{margin:0;font-family:var(--serif);font-size:21px;line-height:1.45}
  .c1-tbl{width:100%;border-collapse:collapse}
  .c1-tbl th{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 12px;border-bottom:1px solid var(--ink)}
  .c1-tbl th.e{text-align:center;width:150px}
  .c1-tbl th.e span{display:inline-flex;align-items:center;gap:8px}
  .c1-tbl th .mk{width:20px;height:20px}
  .c1-tbl td{padding:18px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  .c1-tbl td.q{font-family:var(--serif);font-size:18px}
  .c1-tbl td.q small{display:block;font-family:var(--sans);font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
  .c1-tbl td.r{text-align:center}
  .c1-res{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
  .c1-res .tick,.c1-res .cross{width:22px;height:22px;font-size:12px;color:#fff}
  .c1-res.y{color:var(--green)} .c1-res.y .tick{background:var(--green)}
  .c1-res.n{color:var(--red)} .c1-res.n .cross{background:var(--red)}
  .c1-tbl tr.feat td.q::after{content:"Shown above";display:inline-block;margin-left:10px;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-tint);color:#8a6d1a;border:1px solid var(--gold-line);padding:2px 7px;border-radius:999px;vertical-align:3px}
  .c1-caveat{font-size:13px;color:var(--muted);margin:18px 0 0}
  .c1-foot{background:var(--band);color:#c9cbd1;padding:26px 56px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px}
  .c1-foot .wm{color:#fff;font-size:18px}

  @media (max-width:640px){
    .c1{padding:16px 0 40px}
    .c1-sheet{border-left:0;border-right:0}
    .c1-head{padding:22px 16px 16px}
    .c1-head .wm{font-size:22px}
    .c1-body{padding:0 16px 32px}
    .c1-hero{grid-template-columns:1fr;gap:14px}
    .c1-big{font-size:96px}
    .c1-verdict h1{font-size:24px}
    .c1-q{padding:22px 20px 24px}
    .c1-q-text{font-size:26px}
    .c1-ans-head{padding:14px 20px;flex-wrap:wrap}
    .c1-ans-head .c1-ans-sub{margin-left:0;width:100%}
    .c1-ans-text{padding:22px 20px 6px;font-size:18px}
    .c1-named{padding:12px 20px 20px}
    .c1-verdict-strip{padding:16px 20px;font-size:13px}
    .c1-means p{font-size:18px}
    .c1-tbl thead{display:none}
    .c1-tbl,.c1-tbl tbody,.c1-tbl tr,.c1-tbl td{display:block;width:100%}
    .c1-tbl tr{border-bottom:1px solid var(--line);padding:14px 0}
    .c1-tbl td{border:0;padding:4px 0}
    .c1-tbl td.r{text-align:left;display:flex;align-items:center;gap:10px}
    .c1-tbl td.r::before{content:attr(data-eng);font-size:12px;color:var(--muted);width:78px}
    .c1-foot{padding:22px 16px}
  }

  /* ══════════════════════════════════════════════════════════════════════════
     CONCEPT 2 — AI CONVERSATION / SEARCH EXPERIENCE
     ══════════════════════════════════════════════════════════════════════════ */
  .c2{background:#fcfcfd;min-height:100vh}
  .c2-top{background:var(--band);color:#fff;padding:0 16px}
  .c2-top-in{max-width:760px;margin:0 auto;padding:22px 0 30px}
  .c2-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:#c9cbd1}
  .c2-bar .wm{font-size:22px;color:#fff}
  .c2-title{margin:30px 0 4px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .c2-biz{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .c2-biz span{display:block;font-size:15px;font-weight:500;color:#c9cbd1;letter-spacing:0;margin-top:6px}
  .c2-main{max-width:760px;margin:0 auto;padding:0 16px 56px}
  .c2-thread{background:#fff;border:1px solid var(--line);border-radius:22px;margin-top:-14px;position:relative;box-shadow:0 20px 50px -30px rgba(16,17,20,.35);overflow:hidden;break-inside:avoid}
  .c2-thread-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .c2-thread-head .mk{width:34px;height:34px}
  .c2-thread-head b{font-size:16px}
  .c2-thread-head small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .c2-rec{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .c2-chat{padding:24px 22px 8px;background:linear-gradient(#fafafb,#fff)}
  .c2-who{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .c2-ask{display:flex;flex-direction:column;align-items:flex-end;margin-bottom:22px}
  .c2-ask .c2-who{text-align:right}
  .c2-qbox{background:var(--band);color:#fff;border-radius:20px 20px 6px 20px;padding:16px 22px;font-size:21px;font-weight:600;letter-spacing:-.01em;max-width:90%;position:relative}
  .c2-qbox::before{content:"QUESTION";display:block;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold);margin-bottom:4px}
  .c2-reply{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
  .c2-reply .mk{width:40px;height:40px;margin-top:22px}
  .c2-bubble{background:#fff;border:1px solid var(--line);border-radius:6px 20px 20px 20px;padding:18px 22px;font-size:17px;line-height:1.75;color:#24262b}
  .c2-bubble .chip{display:inline;background:#f1f2f4;border:1px solid #d9dbe0;border-radius:7px;padding:2px 7px;font-weight:650;white-space:normal;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .c2-bubble .chip.me{background:var(--green-tint);border-color:var(--green-line);color:var(--green)}
  .c2-legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin:10px 0 0 52px}
  .c2-legend i{display:inline-block;width:14px;height:10px;background:#f1f2f4;border:1px solid #d9dbe0;border-radius:3px}
  .c2-find{margin:20px 22px 22px;border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:52px 1fr;gap:4px 16px;align-items:center}
  .c2-find.no{background:var(--red-tint);border:1.5px dashed var(--red)}
  .c2-find.yes{background:var(--green-tint);border:1.5px solid var(--green)}
  .c2-find-ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;grid-row:span 2}
  .c2-find.no .c2-find-ic{background:var(--red);color:#fff}
  .c2-find.yes .c2-find-ic{background:var(--green);color:#fff}
  .c2-find-ic svg{width:28px;height:28px}
  .c2-find-k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .c2-find.no .c2-find-k{color:var(--red)} .c2-find.yes .c2-find-k{color:var(--green)}
  .c2-find-n{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .c2-find-n small{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-top:2px}
  .c2-sec{margin-top:40px;break-inside:avoid}
  .c2-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
  .c2-why{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .c2-why div{background:var(--panel);border-radius:14px;padding:16px 16px 18px;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
  .c2-why b{display:block;font-size:28px;color:var(--ink);letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
  .c2-score{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px}
  .c2-tile{border-radius:18px;padding:18px 20px;border:1px solid var(--line);background:#fff}
  .c2-tile.all{background:var(--band);color:#fff;border-color:var(--band)}
  .c2-tile-k{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
  .c2-tile.all .c2-tile-k{color:#c9cbd1}
  .c2-tile-k .mk{width:22px;height:22px}
  .c2-tile-v{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin-top:8px}
  .c2-tile-s{font-size:13px;color:var(--muted)}
  .c2-tile.all .c2-tile-s{color:#c9cbd1}
  .c2-tile.all .c2-tile-v.t-red{color:#ff6b74}
  .c2-qs{display:flex;flex-direction:column;gap:10px}
  .c2-qrow{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;break-inside:avoid}
  .c2-qrow .q{font-size:16px;font-weight:650}
  .c2-qrow .q::before{content:"You asked";display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .c2-qrow .rs{display:flex;gap:8px}
  .c2-pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700;border:1px solid}
  .c2-pill .mk{width:22px;height:22px}
  .c2-pill.y{background:var(--green-tint);border-color:var(--green-line);color:var(--green)}
  .c2-pill.n{background:var(--red-tint);border-color:var(--red-line);color:var(--red)}
  .c2-caveat{font-size:13px;color:var(--muted);margin:14px 0 0}
  .c2-foot{border-top:1px solid var(--line);margin-top:44px;padding-top:18px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media (max-width:640px){
    .c2-biz{font-size:24px}
    .c2-thread{border-radius:18px}
    .c2-thread-head{padding:14px 16px;flex-wrap:wrap}
    .c2-rec{margin-left:0}
    .c2-chat{padding:20px 14px 6px}
    .c2-qbox{font-size:18px;max-width:100%}
    .c2-reply{grid-template-columns:1fr}
    .c2-reply .mk{display:none}
    .c2-bubble{font-size:16px;padding:16px}
    .c2-legend{margin-left:0}
    .c2-find{margin:16px 14px 16px;grid-template-columns:44px 1fr;padding:16px}
    .c2-find-ic{width:44px;height:44px}
    .c2-find-n{font-size:17px}
    .c2-why,.c2-score{grid-template-columns:1fr}
    .c2-qrow{grid-template-columns:1fr}
    .c2-qrow .rs{flex-wrap:wrap}
  }

  /* ══════════════════════════════════════════════════════════════════════════
     CONCEPT 3 — EVIDENCE / SCORECARD
     ══════════════════════════════════════════════════════════════════════════ */
  .c3{padding:28px 16px 64px}
  .c3-wrap{max-width:1080px;margin:0 auto}
  .c3-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:3px solid var(--ink)}
  .c3-head .wm{font-size:24px}
  .c3-head-r{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .c3-head-r div b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .c3-head-r div span{color:var(--ink);font-weight:650;font-size:13px}
  .c3-score{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.6fr;gap:0;margin-top:22px;border:1px solid var(--ink);background:#fff;break-inside:avoid}
  .c3-cell{padding:20px 22px;border-right:1px solid var(--line)}
  .c3-cell:last-child{border-right:0}
  .c3-cell-k{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .c3-cell-k .mk{width:20px;height:20px}
  .c3-big{font-size:72px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
  .c3-mid{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
  .c3-mid small{font-size:.5em;color:var(--faint);font-weight:700;letter-spacing:0}
  .c3-sub{font-size:13px;color:var(--muted);margin-top:6px}
  .c3-meter{display:flex;gap:4px;margin-top:12px}
  .c3-meter i{flex:1;height:8px;border-radius:2px;background:var(--panel-2)}
  .c3-meter i.y{background:var(--green)} .c3-meter i.n{background:var(--red)}
  .c3-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;margin-top:12px;font-size:12px;align-items:center}
  .c3-grid .gh{font-size:10px;font-weight:800;color:var(--faint);text-align:center;letter-spacing:.08em}
  .c3-grid .gl{display:flex;align-items:center;gap:6px;font-weight:650;padding-right:6px;white-space:nowrap}
  .c3-grid .gl .mk{width:18px;height:18px}
  .c3-grid .gc{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
  .c3-grid .gc.y{background:var(--green)} .c3-grid .gc.n{background:var(--red)}
  .c3-verdict{margin-top:14px;display:flex;gap:14px;align-items:flex-start;background:var(--red-tint);border-left:4px solid var(--red);padding:14px 18px;break-inside:avoid}
  .c3-verdict b{font-size:16px}
  .c3-verdict p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
  .c3-sh{display:flex;align-items:baseline;gap:14px;margin:40px 0 14px}
  .c3-sh h2{margin:0;font-size:20px;letter-spacing:-.01em}
  .c3-sh span{font-size:13px;color:var(--muted)}
  .c3-ev{background:#fff;border:1px solid var(--line);margin-bottom:18px;break-inside:avoid;page-break-inside:avoid}
  .c3-ev-top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:#fafafb}
  .c3-ev-no{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;line-height:1.2}
  .c3-ev-no b{display:block;font-size:26px;color:var(--ink);letter-spacing:-.02em}
  .c3-ev-q{border:2px solid var(--ink);border-radius:6px;padding:10px 14px;background:#fff}
  .c3-ev-q small{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .c3-ev-q span{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .c3-ev-tally{font-size:12px;color:var(--muted);text-align:right;line-height:1.4}
  .c3-ev-tally b{display:block;font-size:20px;color:var(--ink)}
  .c3-ev-cols{display:grid;grid-template-columns:1fr 1fr}
  .c3-ev-col{padding:4px 20px 18px;border-right:1px solid var(--line)}
  .c3-ev-col:last-child{border-right:0}
  .c3-dl{display:grid;grid-template-columns:104px 1fr;margin:0}
  .c3-dl dt{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:13px 0 0}
  .c3-dl dd{margin:0;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .c3-dl dd:last-of-type{border-bottom:0}
  .c3-eng{display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:15px}
  .c3-eng .mk{width:24px;height:24px}
  .c3-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:4px;color:#fff}
  .c3-badge.y{background:var(--green)} .c3-badge.n{background:var(--red)}
  .c3-quote{font-size:14.5px;line-height:1.65;color:#2a2c31;border-left:3px solid var(--panel-2);padding-left:12px}
  .c3-quote mark{background:#fff0bf;color:inherit;border-bottom:2px solid var(--yellow);padding:0 2px;font-weight:650}
  .c3-quote mark.me{background:var(--green-tint);border-bottom-color:var(--green)}
  .c3-chips{display:flex;flex-wrap:wrap;gap:6px}
  .c3-chip{font-size:12.5px;font-weight:650;background:var(--gold-tint);border:1px solid var(--gold-line);color:#5f4b0f;border-radius:4px;padding:3px 8px}
  .c3-client{font-weight:800}
  .c3-client.n{color:var(--red)} .c3-client.y{color:var(--green)}
  .c3-caveat{font-size:13px;color:var(--muted);margin:6px 0 0}
  .c3-foot{margin-top:30px;padding-top:16px;border-top:3px solid var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  @media (max-width:900px){
    .c3-score{grid-template-columns:1fr 1fr}
    .c3-cell:nth-child(2){border-right:0}
    .c3-cell:nth-child(-n+2){border-bottom:1px solid var(--line)}
    .c3-ev-cols{grid-template-columns:1fr}
    .c3-ev-col{border-right:0;border-bottom:1px solid var(--line)}
    .c3-ev-col:last-child{border-bottom:0}
  }
  @media (max-width:640px){
    .c3{padding:18px 16px 40px}
    .c3-score{grid-template-columns:1fr}
    .c3-cell{border-right:0;border-bottom:1px solid var(--line)}
    .c3-cell:last-child{border-bottom:0}
    .c3-big{font-size:64px}
    .c3-ev-top{grid-template-columns:1fr;gap:10px;padding:14px 16px}
    .c3-ev-tally{text-align:left}
    .c3-ev-col{padding:4px 16px 14px}
    .c3-dl{grid-template-columns:1fr}
    .c3-dl dt{padding:10px 0 0}
    .c3-dl dd{padding:4px 0 10px}
  }

  /* ══════════════════════════════════════════════════════════════════════════
     CONCEPTS 2A / 2B / 2C — Conversation direction, reworked (Paul, 2026-10-06)
     Order: header → your score → questions + answers → why this matters → LIVE footer.
     760px sheet = the live report's own width (.sheet in aiAuditReportHtml.ts).
     ══════════════════════════════════════════════════════════════════════════ */
  .v{padding:24px 16px 48px;background:#d9dbe0}
  .v-sheet{max-width:760px;margin:0 auto;background:#fff;box-shadow:0 18px 50px -28px rgba(0,0,0,.5);overflow:hidden}
  :root{--k:#101114;--r:#d01f2e;--r-bright:#ff4f5c;--r-tint:#fdecee;--g:#127a3a;--g-bright:#3ddc84;--g-tint:#e3f5ea;--a:#b86e00;--a-bright:#ffb020;--hl:#ffe680}
  .v .t-red{color:var(--r)} .v .t-amber{color:var(--a)} .v .t-green{color:var(--g)}
  .v-on-k .t-red{color:var(--r-bright)} .v-on-k .t-amber{color:var(--a-bright)} .v-on-k .t-green{color:var(--g-bright)}
  /* Header, shared */
  .v-head{background:var(--k);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .v-head .wm{font-size:22px;color:#fff}
  .v-head-r{text-align:right;font-size:12px;color:#c9cbd1;line-height:1.45}
  .v-head-r b{display:block;color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .v-for{font-size:13px;color:#c9cbd1}
  .v-for b{color:#fff}
  /* Answer highlighting, shared */
  .v-ans mark{background:var(--hl);color:var(--k);font-weight:700;padding:1px 4px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .v-ans mark.me{background:var(--g);color:#fff}
  .v-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:4px;color:#fff;white-space:nowrap}
  .v-badge.y{background:var(--g)} .v-badge.n{background:var(--r)}
  .v-eng{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .v-eng .mk{width:24px;height:24px}
  .v-sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--k)}
  .v-sec-h::before{content:"";width:18px;height:4px;background:var(--gold)}
  .v-chip{display:inline-block;font-size:12px;font-weight:700;background:var(--hl);color:var(--k);border-radius:3px;padding:2px 7px;margin:2px 4px 2px 0}
  /* Live footer mount */
  .v-livefoot{display:block}
  .v-livefoot-missing{background:#fff3c4;border:2px dashed #b08a00;color:#4a3a00;padding:16px 28px;font-weight:700;font-size:13px}

  /* ── 2A: bold score band + stacked evidence ── */
  .a-score{background:var(--k);color:#fff;padding:6px 28px 26px;display:grid;grid-template-columns:auto 1fr;gap:18px 30px;align-items:center;border-top:1px solid #26272d}
  .a-big{font-size:104px;font-weight:900;letter-spacing:-.06em;line-height:.9}
  .a-big-k{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:8px}
  .a-big-s{font-size:14px;color:#fff;font-weight:600;margin-top:2px}
  .a-verdict{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.2;margin:0 0 14px}
  .a-engs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .a-eng{border:1px solid #33343b;border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center}
  .a-eng .mk{width:28px;height:28px;grid-row:span 2}
  .a-eng-l{font-size:12.5px;font-weight:700;color:#c9cbd1}
  .a-eng-v{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1;grid-row:span 2}
  .a-eng-d{display:flex;gap:4px}
  .a-eng-d i{width:14px;height:6px;border-radius:2px;background:var(--r-bright)}
  .a-eng-d i.y{background:var(--g-bright)}
  .a-body{padding:26px 28px 8px}
  .a-q{background:var(--k);color:#fff;border-left:6px solid var(--gold);padding:14px 18px;border-radius:6px 6px 0 0}
  .a-q small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .a-q span{font-size:22px;font-weight:800;letter-spacing:-.015em}
  .a-card{border:2px solid var(--k);border-top:0;border-radius:0 0 6px 6px;margin-bottom:22px;break-inside:avoid}
  .a-card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #d5d7dc;background:#f6f6f7}
  .a-card-t{padding:14px 16px 16px;font-size:16.5px;line-height:1.7;color:#1b1c20;margin:0}
  .a-also{display:grid;grid-template-columns:auto auto 1fr;gap:8px 12px;align-items:center;padding:10px 16px;border-top:1px dashed #c9cbd1;font-size:13px}
  .a-also .lbl{color:#5d6067;font-size:12px}
  .a-compact{border:2px solid var(--k);border-radius:6px;margin-bottom:12px;break-inside:avoid;overflow:hidden}
  .a-compact-q{display:flex;align-items:center;gap:12px;background:var(--k);color:#fff;padding:9px 14px}
  .a-compact-q small{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
  .a-compact-q span{font-weight:750;font-size:16px}
  .a-row{display:grid;grid-template-columns:150px auto 1fr;gap:6px 12px;align-items:center;padding:9px 14px;border-top:1px solid #e3e4e8;font-size:13px}
  .a-row:first-of-type{border-top:0}
  .a-row .lbl{color:#5d6067;font-size:12px;margin-right:2px}
  .a-why{display:grid;grid-template-columns:auto auto 1fr;background:var(--gold);color:var(--k);margin-top:18px;break-inside:avoid}
  .a-why div{padding:14px 20px;border-right:2px solid rgba(16,17,20,.18);font-size:13px;font-weight:600;line-height:1.3}
  .a-why div:last-child{border-right:0}
  .a-why b{display:block;font-size:24px;font-weight:900;letter-spacing:-.03em}
  .a-why-h{font-size:10.5px!important;font-weight:800!important;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:2px;opacity:.75}
  @media (max-width:640px){
    .v{padding:0}
    .v-head{padding:14px 16px}
    .v-head-r{text-align:left}
    .a-score{grid-template-columns:1fr;padding:4px 16px 20px}
    .a-big{font-size:88px}
    .a-verdict{font-size:18px}
    .a-engs{grid-template-columns:1fr}
    .a-body{padding:20px 16px 4px}
    .a-q span{font-size:19px}
    .a-card-h{flex-wrap:wrap}
    .a-card-t{font-size:15.5px}
    .a-also{grid-template-columns:auto 1fr}
    .a-also .rv{grid-column:1/-1}
    .a-row{grid-template-columns:auto 1fr}
    .a-row .rv{grid-column:1/-1}
    .a-row .v-badge,.a-also .v-badge{justify-self:end}
    .a-why div:last-child b{display:none}
    .a-why{grid-template-columns:1fr}
    .a-why div{border-right:0;border-bottom:2px solid rgba(16,17,20,.18);padding:12px 16px}
  }

  /* ── 2B: scoreboard + featured missed search (shortest) ── */
  .b-board{display:grid;grid-template-columns:1.35fr 1fr 1fr;border-bottom:3px solid var(--k)}
  .b-cell{padding:16px 22px 16px;border-right:1px solid #d5d7dc;position:relative}
  .b-cell:last-child{border-right:0}
  .b-cell::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--tone)}
  .b-cell.red{--tone:var(--r)} .b-cell.amber{--tone:var(--a)} .b-cell.green{--tone:var(--g)}
  .b-k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--k);margin-top:4px}
  .b-k .mk{width:22px;height:22px}
  .b-v{font-size:56px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-top:6px}
  .b-v small{font-size:.45em;color:#8f939d;letter-spacing:0}
  .b-cell.all .b-v{font-size:64px}
  .b-s{font-size:13px;font-weight:700;color:#3a3c42}
  .b-verdict{background:var(--k);color:#fff;padding:11px 22px;font-size:15px;font-weight:700}
  .b-verdict span{color:#c9cbd1;font-weight:500}
  .b-body{padding:22px 22px 6px}
  .b-q{background:var(--gold);color:var(--k);padding:14px 18px;border-radius:6px;border:2px solid var(--k)}
  .b-q small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .b-q span{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
  .b-ans{display:grid;grid-template-columns:1fr 200px;border:2px solid var(--k);border-radius:6px;margin-top:10px;overflow:hidden;break-inside:avoid}
  .b-ans-main{padding:12px 16px 14px}
  .b-ans-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .b-ans-t{margin:0;font-size:15.5px;line-height:1.68;color:#1b1c20}
  .b-side{background:var(--k);color:#fff;padding:12px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
  .b-side-k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .b-side ol{margin:0;padding-left:18px;line-height:1.45}
  .b-side li{margin:2px 0}
  .b-you{margin-top:auto;border-top:1px solid #33343b;padding-top:8px}
  .b-you b{display:block;font-size:13px}
  .b-you.n b{color:var(--r-bright)} .b-you.y b{color:var(--g-bright)}
  .b-tbl{width:100%;border-collapse:separate;border-spacing:0 4px;margin-top:2px}
  .b-tbl th{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--k);text-align:left;padding:0 10px 2px}
  .b-tbl th.e{width:150px}
  .b-tbl th .mk{width:18px;height:18px;display:inline-flex;vertical-align:-4px;margin-right:6px}
  .b-tbl td{padding:9px 10px;font-size:14.5px;font-weight:650;background:#f2f3f5}
  .b-tbl td.q{border-left:4px solid var(--k)}
  .b-tbl td.r{color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .b-tbl td.r.y{background:var(--g)} .b-tbl td.r.n{background:var(--r)}
  .b-why{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;border-top:3px solid var(--k);margin-top:16px;padding:12px 0 16px;font-size:13.5px;color:#2a2c31;break-inside:avoid}
  .b-why b{font-size:18px;font-weight:900;color:var(--k);margin-right:4px}
  .b-why .h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--k)}
  @media (max-width:640px){
    .b-board{grid-template-columns:1fr 1fr}
    .b-cell.all{grid-column:1/-1;border-right:0;border-bottom:1px solid #d5d7dc}
    .b-cell{padding:14px 16px}
    .b-v{font-size:44px} .b-cell.all .b-v{font-size:60px}
    .b-verdict{padding:10px 16px;font-size:14px}
    .b-body{padding:18px 16px 4px}
    .b-q span{font-size:20px}
    .b-ans{grid-template-columns:1fr}
    .b-ans-h{flex-wrap:wrap}
    .b-ans-t{font-size:15px}
    .b-tbl thead{display:none}
    .b-tbl,.b-tbl tbody,.b-tbl tr{display:block}
    .b-tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:8px}
    .b-tbl td{display:block}
    .b-tbl td.q{grid-column:1/-1}
    .b-tbl td.r{font-size:11px;letter-spacing:.04em;padding:8px}
    .b-tbl td.r::before{content:attr(data-eng);display:block;font-weight:600;letter-spacing:0;text-transform:none;opacity:.9;font-size:11.5px}
  }

  /* ── 2C: one card per question ── */
  .c-score{background:var(--k);color:#fff;padding:4px 28px 20px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;border-top:1px solid #26272d}
  .c-big{display:flex;align-items:baseline;gap:14px}
  .c-big b{font-size:76px;font-weight:900;letter-spacing:-.06em;line-height:.95}
  .c-big span{font-size:13px;font-weight:700;line-height:1.35}
  .c-big span em{display:block;font-style:normal;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .c-engs{display:flex;gap:10px;margin-left:auto}
  .c-eng{display:flex;align-items:center;gap:10px;background:#1d1e23;border:1px solid #33343b;border-radius:8px;padding:9px 14px 9px 10px}
  .c-eng .mk{width:26px;height:26px}
  .c-eng span{font-size:12px;color:#c9cbd1;font-weight:700;line-height:1.2}
  .c-eng b{display:block;font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1}
  .c-verdict{width:100%;font-size:15px;font-weight:700;border-top:1px solid #33343b;padding-top:12px}
  .c-verdict span{font-weight:500;color:#c9cbd1}
  .c-body{padding:22px 24px 6px}
  .c-card{border:2px solid var(--k);border-radius:6px;margin-bottom:14px;overflow:hidden;break-inside:avoid}
  .c-card-q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--k);color:#fff;padding:10px 14px}
  .c-card-q .n{font-size:12px;font-weight:900;color:var(--k);background:var(--gold);border-radius:4px;padding:3px 7px}
  .c-card-q .q{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .c-card-q .q small{display:block;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--gold)}
  .c-card-q .t{font-size:12px;color:#c9cbd1;text-align:right;line-height:1.2}
  .c-card-q .t b{display:block;font-size:18px}
  .c-er{display:grid;grid-template-columns:132px 1fr;gap:6px 14px;padding:10px 14px;border-top:1px solid #e3e4e8;border-left:5px solid var(--r)}
  .c-er:first-of-type{border-top:0}
  .c-er.y{border-left-color:var(--g);background:#f6fbf8}
  .c-er-l{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

/* ═══ 2A / 2B / 2C — shared pieces ═══ */
/* The live system stores the featured answer cut at 600 characters (hookAudit.ts answer_excerpt).
   The concept never shows more than that; a longer text would end in an ellipsis. */
const ANSWER_CAP = 600;
const capped = (a) => a.text.length > ANSWER_CAP ? { ...a, text: a.text.slice(0, ANSWER_CAP).replace(/\s+\S*$/, "") + "…" } : a;
const vAns = (a) => highlight(capped(a), (n, i, me) => '<mark' + (me ? ' class="me"' : "") + '>' + n + '</mark>');
const vBadge = (y) => '<span class="v-badge ' + (y ? "y" : "n") + '">' + (y ? "&#10003; Named" : "&#10005; Not named") + '</span>';
const vEng = (k, suffix) => '<span class="v-eng">' + mark(k) + label(k) + (suffix || "") + '</span>';
const vChips = (a) => a.rivals.map((r) => '<span class="v-chip">' + esc(r) + '</span>').join("");
const vHead = () => '<header class="v-head"><div><div class="wm">Findable<i>.</i></div><div class="v-for">Prepared for <b>' + esc(F.business) + '</b></div></div>' +
  '<div class="v-head-r"><b>' + F.reportType + '</b>' + F.date + '</div></header>';
const allRivals = () => { const s = new Set(); F.questions.forEach((q) => F.engines.forEach((e) => q.answers[e.key].rivals.forEach((r) => s.add(r)))); return s.size; };
const missed = () => S.total - S.named;
const vFoot = () => '<div class="v-livefoot"></div>';
/* Mount the LIVE CTA + footer in a shadow root so its stylesheet applies unchanged and cannot leak. */
function mountLiveFooters() {
  document.querySelectorAll(".v-livefoot").forEach((host) => {
    if (!window.LIVE_FOOTER) { host.className = "v-livefoot-missing"; host.textContent = "EXISTING LIVE REPORT FOOTER CONTINUES UNCHANGED HERE (run extract-live-footer.ts to show it)"; return; }
    const root = host.shadowRoot || host.attachShadow({ mode: "open" });
    root.innerHTML = '<style>' + LIVE_FOOTER.css.replace(/:root/g, ":host") +
      ':host{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}.sheet{margin:0!important;max-width:none!important;border-radius:0!important;box-shadow:none!important}</style>' +
      '<div class="sheet">' + LIVE_FOOTER.html + '</div>';
  });
}

    '</div>' + vFoot() + '</div>';
}

/* ═══ CONCEPT 4 — HOOK AUDIT HYBRID ═══ */
/* Website issues — FIXTURE, in the shape the live crawl check produces (CrawlFault: title, detail,
   minor) plus a severity and a pages-affected count. Titles reuse the live wording where one exists
   (crawlCheck.ts buildFaultLines). Structured data is deliberately left out: it tested negative as a
   lever (CLAUDE.md §5), so it never headlines a client report. */
const SITE = {
  pagesChecked: 3,
  issues: [
    { sev: "high", title: "Your pages have no clear heading", pages: 2, detail: "No main (H1) heading, so search engines and AI have no plain statement of what the page is about." },
    { sev: "high", title: "There isn’t enough on your pages", pages: 2, detail: "Under 120 words on the page. Not enough for AI to quote you from." },
    { sev: "med", title: "11 images without alt text", pages: 1, detail: "Missing descriptions weaken accessibility and how clearly the page’s content reads." },
    { sev: "low", title: "Title tag too long", pages: 1, detail: "Shorter titles are easier for search engines and AI to interpret." },
  ],
};
/* Engine cards: 0 of 3 red, 1 of 3 amber, 2 or 3 of 3 green. The overall figure keeps tone()
   (the live verdictBand), so 17% reads as poor. */
const engTone = (n, t) => n === 0 ? "red" : n / t < 0.5 ? "amber" : "green";
const SEV = { high: "High", med: "Medium", low: "Low" };
function renderC4(nv, hasSite) {
  const f = feat(nv), t = tone(S.named, S.total);
  const engs = S.per.map((e) => '<div class="h-eng ' + engTone(e.named, e.total) + '">' + mark(e.key) + '<span class="h-eng-l">' + e.label + '<small>' + e.named + ' of ' + e.total + ' answers</small></span><span class="h-eng-v">' + e.named + '/' + e.total + '</span></div>').join("");
  const rows = F.questions.map((q, qi) => '<tr class="' + (qi === f.qi ? "feat" : "") + '"><td class="q">' + esc(q.q) + '</td>' + F.engines.map((e) => { const y = q.answers[e.key].named;
    return '<td class="r" data-eng="' + e.label + '"><span class="h-chip ' + (y ? "y" : "n") + '">' + (y ? "&#10003; Named" : "&#10005; Not named") + '</span></td>'; }).join("") + '</tr>').join("");
  const site = hasSite
    ? '<div class="h-iss"><div class="h-iss-top"><span>We checked <b>' + SITE.pagesChecked + ' pages</b> of your website the way search engines and AI read it.</span><span>Strongest ' + SITE.issues.length + ' issues</span></div>' +
        SITE.issues.map((i) => '<div class="h-issue"><span class="h-sev ' + i.sev + '">' + SEV[i.sev] + '</span><span class="h-issue-t">' + esc(i.title) + '</span><span class="h-pages">On ' + i.pages + ' of ' + SITE.pagesChecked + ' pages</span><p class="h-issue-p">' + esc(i.detail) + '</p></div>').join("") + '</div>'
    : '<div class="h-nosite"><span class="h-sev high">High</span><b>No website found</b><p>AI can’t recommend a business it can’t read, and right now there’s nothing for it to read. Google AI in particular leans on businesses’ own websites.</p></div>';
  document.getElementById("c4").innerHTML = '<div class="v-sheet">' +
    '<header class="h-head"><div class="wm">Findable<i>.</i></div><div class="h-title">' + F.reportType + '<span>Prepared for ' + esc(F.business) + '</span></div><div class="h-date">' + F.date + '</div></header>' +
    '<section class="h-score v-on-k"><div class="h-big"><em>Your score</em><b class="t-' + t + '">' + S.pct + '%</b><span>' + S.named + ' of ' + S.total + ' answers named you</span></div>' +
      '<div><p class="h-verdict">' + headline + '</p><div class="h-engs">' + engs + '</div></div></section>' +
    '<div class="h-body">' +
      '<section class="h-sec"><h2 class="v-sec-h">' + (f.a.named ? "Featured search" : "Featured missed search") + '</h2>' +
        '<div class="h-q"><small>What we asked</small><span>' + esc(f.q) + '</span></div>' +
        '<div class="h-proof"><div class="h-ans"><div class="h-ans-h">' + vEng(f.ek, " answered") + vBadge(f.a.named) + '</div><p class="v-ans">' + vAns(f.a) + '</p></div>' +
          '<aside class="h-sum"><div><span class="h-sum-k">Result</span>' + vBadge(f.a.named) + '</div>' +
          '<div><span class="h-sum-k">' + (f.a.named ? "Also named" : "Named instead") + '</span><ol>' + f.a.rivals.map((r) => '<li>' + esc(r) + '</li>').join("") + '</ol></div>' +
          '<div class="h-you ' + (f.a.named ? "y" : "n") + '"><span class="h-sum-k">Your business</span>' + (f.a.named ? "&#10003; Named" : "&#10005; Not named") + '</div></aside></div></section>' +
      '<section class="h-sec"><h2 class="v-sec-h">All questions we asked</h2>' +
        '<table class="h-tbl"><thead><tr><th>Question</th>' + F.engines.map((e) => '<th class="e">' + mark(e.key) + e.label + '</th>').join("") + '</tr></thead><tbody>' + rows + '</tbody></table></section>' +
      '<section class="h-sec"><h2 class="v-sec-h">' + (hasSite ? "Website issues we found" : "Your website") + '</h2>' + site + '</section>' +
      '<section class="h-sec"><h2 class="v-sec-h">Why this matters</h2><div class="h-why">' +
        '<div><b>' + missed() + ' of ' + S.total + '</b>answers sent customers elsewhere</div>' +
        '<div><b>' + allRivals() + '</b>competitors appeared instead</div>' +
        '<div><b>The new shortlist</b>AI is another place customers now choose who to contact.</div></div></section>' +
    '</div>' + vFoot() + '</div>';
}

/* ── Gallery ── */
const params = new URLSearchParams(location.search);
const IDS = ["1", "2", "3", "2a", "2b", "2c", "4"];
let site = params.get("site") !== "0";
let cur = IDS.includes(params.get("c")) ? params.get("c") : "1";
let named = params.get("named") === "1";
if (params.get("bar") === "0") document.getElementById("gal").style.display = "none";
function render() {
  gid = 0;
  renderC1(named); renderC2(named); renderC3(); renderC2A(named); renderC2B(named); renderC2C(); renderC4(named, site); mountLiveFooters();
  document.querySelectorAll("[data-site]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.site === "1") === site)));
  document.querySelector(".gal-site").style.display = cur === "4" ? "flex" : "none";
  document.querySelectorAll(".concept").forEach((s) => s.classList.toggle("on", s.id === "c" + cur));
  document.querySelectorAll("[data-c]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === cur)));
  document.querySelectorAll("[data-named]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.named === "1") === named)));
  document.querySelector(".gal-toggle").style.visibility = (cur === "3" || cur === "2c") ? "hidden" : "visible";
}
document.querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => { cur = b.dataset.c; render(); window.scrollTo(0, 0); }));
document.querySelectorAll("[data-named]").forEach((b) => b.addEventListener("click", () => { named = b.dataset.named === "1"; render(); }));
document.querySelectorAll("[data-site]").forEach((b) => b.addEventListener("click", () => { site = b.dataset.site === "1"; render(); }));
render();
</script>
</body>
</html>
