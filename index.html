    <script>
      (function captureTrafficAttributionEarly() {
        try {
          var existing = localStorage.getItem('traffic_attribution');
          if (existing) return;

          var params = new URLSearchParams(window.location.search);
          var fbclid = params.get('fbclid');
          var utmSource = params.get('utm_source');
          var utmMedium = params.get('utm_medium');
          var utmCampaign = params.get('utm_campaign');
          var utmContent = params.get('utm_content');
          var utmTerm = params.get('utm_term');

          if (!fbclid && !utmSource && !utmMedium && !utmCampaign && !utmContent && !utmTerm) return;

          var trafficSource = null;
          var normalizedSource = utmSource ? utmSource.toLowerCase() : '';
          if (fbclid || normalizedSource === 'meta' || normalizedSource === 'facebook' || normalizedSource === 'instagram') {
            trafficSource = 'meta_ads';
          } else if (utmSource) {
            trafficSource = 'paid_' + utmSource;
          }

          var attribution = {
            fbclid: fbclid || undefined,
            utm_source: utmSource || undefined,
            utm_medium: utmMedium || undefined,
            utm_campaign: utmCampaign || undefined,
            utm_content: utmContent || undefined,
            utm_term: utmTerm || undefined,
            // Compatibility with existing backend fields/readers
            utm_ad: utmContent || undefined,
            utm_adset: utmTerm || undefined,
            traffic_source: trafficSource || undefined,
            captured_at: new Date().toISOString(),
          };

          localStorage.setItem('traffic_attribution', JSON.stringify(attribution));
        } catch (_) {
          // Must never block app boot
        }
      })();
    </script>

      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1888907435320624');
      fbq('track', 'PageView');
    };
    if ('requestIdleCallback' in window) {
      requestIdleCallback(window.__loadFBPixel, { timeout: 3000 });
    } else {
      setTimeout(window.__loadFBPixel, 2500);
    }
    ['scroll','click','touchstart','keydown'].forEach(function(evt) {
      document.addEventListener(evt, window.__loadFBPixel, { once: true, passive: true });
    });
    </script>
