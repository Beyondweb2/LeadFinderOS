# ⛔ THESE THREE WERE MISSING, AND THE OMISSION IS WHAT KILLED THEIR INTERNAL CALLERS — 2026-08-14.
# A function absent from this file deploys with the platform default, verify_jwt = TRUE, so the
# platform demands a JWT-shaped bearer before the handler runs. All three worked for weeks because
# SUPABASE_SERVICE_ROLE_KEY used to BE a JWT; the ~2026-08-11 key rotation made it sb_secret-shaped
# and every internal fetch started dying with "Invalid API key" — while functions listed here
# (create-ai-audit) kept accepting the identical bearer, which is why paid baselines flowed while
# the cleaner, auto-reports and derive-on-reply all silently stopped. Each handler enforces its own
# auth (user JWT ownership or CRON_SECRET + x-internal-job), same as every other entry above.
[functions.extract-competitors]
verify_jwt = false

[functions.generate-report]
verify_jwt = false

[functions.derive-audit]
verify_jwt = false

# review-reply has NO internal callers — the SPA calls it with the operator's JWT, so the platform
# gate stays ON and the handler still does its own getUser. Listed here so the verify_jwt state is
# explicit rather than a platform default (the trap this file's header records).
[functions.review-reply]
verify_jwt = true

# page-generator: same shape as review-reply — SPA-only caller with the operator's JWT, handler
# does its own getUser + owner-scoping. Explicit entry, never a platform default.
[functions.page-generator]
verify_jwt = true

# mockup: SPA-only caller with the operator JWT; the handler does its own getUser + admin
# check. Explicit entry, never a platform default (§8).
# ⛔ true, MATCHING page-generator, AND THE REASON IS THE POINT OF HAVING TWO LAYERS: the outer
# one exists to save you when someone later edits the inner one. The handler's admin gate is
# what refuses today (probed: an unauthenticated POST and an anon-key POST both got the
# handler's own {"ok":false,"error":"unauthorized"}), so this was never a hole — but a future
# edit to that gate should not be the only thing standing between the internet and this
# function. Paul's call, 2026-09-11.
# ⚠️ SAFE HERE ONLY BECAUSE THIS FUNCTION HAS NO INTERNAL CALLER. verify_jwt = true demands a
# JWT-shaped bearer at the GATEWAY, which is exactly what killed three internal call paths when
# the service key stopped being a JWT (§8). Never set this on a function a cron or another
# function calls with CRON_SECRET.
[functions.mockup]
verify_jwt = true
