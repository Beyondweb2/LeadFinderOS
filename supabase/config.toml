# Resend has no Supabase JWT, so this MUST be public. The Svix signature is the only gate and the
# handler fails closed on it: unset secret, missing headers, stale timestamp or a bad signature all
# return 401 having written nothing. Adding the entry in the same commit as the function, because
# the platform default is verify_jwt = TRUE and a function absent from this file deploys with it —
# which would refuse every event silently (CLAUDE.md §8, the 2026-08-14 three-dead-paths incident).
verify_jwt = false

